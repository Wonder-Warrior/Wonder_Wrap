name: Build & Release Wonder Wrap

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:TEMP\ffmpeg" -Force
          $bin = (Get-ChildItem "$env:TEMP\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1).DirectoryName
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build WonderWrap_Installer.exe
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v", "V")
          powershell -ExecutionPolicy Bypass -File .\build_release.ps1 -Version $ver

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WonderWrap_Installer.exe
          generate_release_notes: true
